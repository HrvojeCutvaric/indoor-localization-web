<div class="details-panel">
  <h3>Asset details</h3>

  <div class="details-content">
    <div class="loading-state" *ngIf="loading">
      <span class="spinner"></span>
      <p>Loading...</p>
    </div>

    <div class="empty-state" *ngIf="!loading && !asset">
      <p>Select an asset to view details</p>
    </div>

    <div class="asset-info" *ngIf="!loading && asset">
      <div class="info-row">
        <span class="label">Name:</span>
        <span class="value">{{ asset.name }}</span>
      </div>

      <div class="info-row">
        <span class="label">X:</span>
        <span class="value">{{ asset.x }}</span>
      </div>

      <div class="info-row">
        <span class="label">Y:</span>
        <span class="value">{{ asset.y }}</span>
      </div>

      <div class="info-row">
        <span class="label">Floor map ID:</span>
        <span class="value">{{ asset.floorMapId }}</span>
      </div>

      <div class="info-row">
        <span class="label">Active:</span>
        <span class="value">{{ asset.active ? 'Yes' : 'No' }}</span>
      </div>

      <div class="info-row">
        <span class="label">Color:</span>
        <span class="value"><span class="color-swatch" [style.background]="asset.color"></span> {{ asset.color }}</span>
      </div>

      <div class="info-row" *ngIf="asset.lastSync">
        <span class="label">Last synced:</span>
        <span class="value">{{ asset.lastSync }}</span>
      </div>
    </div>
  </div>
</div>
