<div class="form-container">
  <h3>{{ isEditMode ? 'Edit Asset' : 'Create New Asset' }}</h3>

  <form [formGroup]="form" (ngSubmit)="submit()">
    <div class="form-group" [ngClass]="{ 'has-error': f['name'].invalid && f['name'].touched }">
      <label for="name">Name *</label>
      <input
        type="text"
        id="name"
        formControlName="name"
        placeholder="Enter asset name"
        [disabled]="isLoading"
      />
      <div class="error-text" *ngIf="f['name'].invalid && f['name'].touched">
        <span *ngIf="f['name'].errors?.['required']">Name is required.</span>
      </div>
    </div>

    <div class="form-row two-cols">
      <div class="form-group" [ngClass]="{ 'has-error': f['floorMapId'].invalid && f['floorMapId'].touched }">
        <label for="floorMapId">Floor Map *</label>
        <select id="floorMapId" formControlName="floorMapId" [disabled]="isLoading || mapsLoading">
          <option value="" disabled selected>{{ mapsLoading ? 'Loading maps...' : 'Select a floor map' }}</option>
          <option *ngFor="let map of maps" [ngValue]="getMapIdAsNumber(map.id)">
            {{ map.name }}
          </option>
        </select>
        <div class="error-text" *ngIf="f['floorMapId'].invalid && f['floorMapId'].touched">
          <span *ngIf="f['floorMapId'].errors?.['required']">Floor map is required.</span>
        </div>
      </div>

      <div class="form-group">
        <label for="color">Color</label>

        <div class="color-control">
          <!-- visual swatch and hex value (native input will be overlayed invisibly on top of the swatch) -->
          <div class="color-preview" [style.background]="form.get('color')?.value"></div>
          <div class="color-hex">{{ form.get('color')?.value }}</div>

          <!-- keep native color input for accessibility; overlay it over the preview and hide native UI -->
          <input class="color-input" type="color" id="color" formControlName="color" [disabled]="isLoading" />
        </div>
      </div>
    </div>

    <div class="form-group">
      <label class="checkbox-label">
        <span class="checkbox-text">Active</span>
        <input type="checkbox" formControlName="active" [disabled]="isLoading" />
      </label>
    </div>

    <div class="api-error" *ngIf="errorMessage">
      {{ errorMessage }}
    </div>

    <div class="form-actions">
      <button
        type="submit"
        class="btn btn-primary"
        [disabled]="form.invalid || isLoading"
      >
        <span *ngIf="!isLoading">{{ isEditMode ? 'Save Changes' : 'Create Asset' }}</span>
        <span *ngIf="isLoading" class="loading-spinner">
          <span class="spinner"></span>
          Saving...
        </span>
      </button>
      <button type="button" class="btn btn-secondary" (click)="onCancel()" [disabled]="isLoading">
        Cancel
      </button>
    </div>
  </form>
</div>
