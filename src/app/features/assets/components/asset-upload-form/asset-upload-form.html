<div class="form-container">
  <h3>{{ isEditMode ? 'Edit Asset' : 'Create New Asset' }}</h3>

  <form [formGroup]="form" (ngSubmit)="submit()">
    <div class="form-group" [ngClass]="{ 'has-error': f['name'].invalid && f['name'].touched }">
      <label for="name">Name *</label>
      <input
        type="text"
        id="name"
        formControlName="name"
        placeholder="Enter asset name"
        [disabled]="isLoading"
      />
      <div class="error-text" *ngIf="f['name'].invalid && f['name'].touched">
        <span *ngIf="f['name'].errors?.['required']">Name is required.</span>
      </div>
    </div>

    <div class="form-group">
      <label for="description">Description</label>
      <textarea
        id="description"
        formControlName="description"
        placeholder="Enter asset description (optional)"
        rows="3"
        [disabled]="isLoading"
      ></textarea>
    </div>

    <div class="form-group">
      <label for="status">Status</label>
      <input
        type="text"
        id="status"
        formControlName="status"
        placeholder="e.g., Active, Inactive"
        [disabled]="isLoading"
      />
    </div>

    <div class="api-error" *ngIf="errorMessage">
      {{ errorMessage }}
    </div>

    <div class="form-actions">
      <button
        type="submit"
        class="btn btn-primary"
        [disabled]="form.invalid || isLoading"
      >
        <span *ngIf="!isLoading">{{ isEditMode ? 'Save Changes' : 'Create Asset' }}</span>
        <span *ngIf="isLoading" class="loading-spinner">
          <span class="spinner"></span>
          Saving...
        </span>
      </button>
      <button type="button" class="btn btn-secondary" (click)="onCancel()" [disabled]="isLoading">
        Cancel
      </button>
    </div>
  </form>
</div>
