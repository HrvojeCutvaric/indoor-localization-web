<div class="registration-page">
    <div class="left-panel">
        <h1>Indoor<br />Localization</h1>
    </div>

    <div class="right-panel">
        <div class="form-container">
            <h2>Create new account</h2>

            <form>
                <!-- Email -->
                <div class="floating-group">
                    <input id="email" type="email" placeholder=" " autocomplete="email" />
                    <label for="email">Email:</label>
                </div>

                <!-- Username -->
                <div class="floating-group">
                    <input id="username" type="text" placeholder=" " autocomplete="username" />
                    <label for="username">Username:</label>
                </div>

                <!-- Password -->
                <div class="floating-group has-toggle">
                    <input id="password" type="password" placeholder=" " autocomplete="new-password" />
                    <label for="password">Password:</label>
                    <button class="toggle" type="button" aria-label="Show password">
                        <svg viewBox="0 0 24 24" aria-hidden="true">
                            <path
                                d="M12 5c5.5 0 9.7 4.2 10.8 6-1.1 1.8-5.3 6-10.8 6S2.3 12.8 1.2 11C2.3 9.2 6.5 5 12 5zm0 2C8 7 4.8 9.6 3.5 11 4.8 12.4 8 15 12 15s7.2-2.6 8.5-4C19.2 9.6 16 7 12 7zm0 2.5a3.5 3.5 0 1 1 0 7 3.5 3.5 0 0 1 0-7z" />
                        </svg>
                    </button>
                </div>

                <!-- Confirm Password -->
                <div class="floating-group has-toggle">
                    <input id="confirmPassword" type="password" placeholder=" " autocomplete="new-password" />
                    <label for="confirmPassword">Confirm Password:</label>
                    <button class="toggle" type="button" aria-label="Show password">
                        <svg viewBox="0 0 24 24" aria-hidden="true">
                            <path
                                d="M12 5c5.5 0 9.7 4.2 10.8 6-1.1 1.8-5.3 6-10.8 6S2.3 12.8 1.2 11C2.3 9.2 6.5 5 12 5zm0 2C8 7 4.8 9.6 3.5 11 4.8 12.4 8 15 12 15s7.2-2.6 8.5-4C19.2 9.6 16 7 12 7zm0 2.5a3.5 3.5 0 1 1 0 7 3.5 3.5 0 0 1 0-7z" />
                        </svg>
                    </button>
                </div>

                <button class="register-btn" type="submit">Register</button>

                <p class="login-text">
                    Already have an account? <a class="login-link" href="#">Login</a>
                </p>
            </form>
        </div>
    </div>
</div>
