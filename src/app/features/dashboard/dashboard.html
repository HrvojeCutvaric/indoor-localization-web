<div class="dashboard-container">
    <header class="dashboard-header">
        <div class="header-left">
            <h1 class="dashboard-title">Dashboard</h1>

            <nav class="main-nav">
                <button class="nav-link" [class.is-active]="activeSection === 'maps'"
                    (click)="setActiveSection('maps')">
                    Maps
                </button>

                <button class="nav-link" [class.is-active]="activeSection === 'assets'"
                    (click)="setActiveSection('assets')">
                    Assets
                </button>

                <button class="nav-link" [class.is-active]="activeSection === 'zones'"
                    (click)="setActiveSection('zones')">
                    Zones
                </button>

                <button class="nav-link" [class.is-active]="activeSection === 'reports'"
                    (click)="toggleReportsMenu($event)">
                    Reports
                </button>

                <!-- Reports burger menu -->
                <div class="reports-burger">
                    <button class="burger-btn" (click)="toggleReportsMenu($event)" aria-label="Open reports menu">
                        <span class="bar"></span>
                        <span class="bar"></span>
                        <span class="bar"></span>
                    </button>

                    <div class="reports-menu" *ngIf="showReportsMenu" (click)="$event.stopPropagation()">
                        <a (click)="navigateToReport('/reports/heatmap')">Heatmap</a>
                        <a (click)="navigateToReport('/reports/trail-map')">Trail Map</a>
                        <a (click)="navigateToReport('/reports/zone-retention')">Zone Retention</a>
                    </div>
                </div>
            </nav>
        </div>

        <button (click)="logout()" class="logout-btn">Logout</button>
    </header>

    <div class="success-banner" *ngIf="successMessage">
        {{ successMessage }}
    </div>

    <main class="dashboard-content">
        <section *ngIf="activeSection === 'maps'" class="section section-maps">
            <h2>Maps</h2>
            <app-map-canvas></app-map-canvas>
        </section>

        <section *ngIf="activeSection === 'assets'" class="section section-assets">
            <h2>Assets</h2>
            <app-asset-management></app-asset-management>
        </section>

        <section *ngIf="activeSection === 'zones'" class="section section-zones">
            <app-zones-management></app-zones-management>
        </section>

        <section *ngIf="activeSection === 'reports'" class="section section-reports">
            <h2>Reports</h2>
            <p>Select a report using the burger menu in the header, or use the shortcuts below to open a report page.</p>

            <div class="report-links">
                <button class="btn" (click)="navigateToReport('/reports/heatmap')">Open Heatmap</button>
                <button class="btn" (click)="navigateToReport('/reports/trail-map')">Open Trail Map</button>
                <button class="btn" (click)="navigateToReport('/reports/zone-retention')">Open Zone Retention</button>
            </div>
        </section>
    </main>
</div>
